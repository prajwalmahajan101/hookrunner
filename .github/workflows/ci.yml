# CI — required merge gates for hookrunner.
#
# Jobs install the project's `dev` extra (unpinned) so each Python version
# resolves a compatible set; the deps-drift job separately proves the committed
# requirements/*.txt still match their *.in + pyproject.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  types:
    name: mypy --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: mypy hookrunner

  test:
    name: tests py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      # Coverage gate stays off until the signature-verification code lands;
      # raise to the 80% DoD target once hookrunner/schemes.py exists.
      - run: pytest -q

  deps-drift:
    name: requirements in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-tools==7.6.1
      # Compile INTO a copy of the committed lockfile so pip-compile honours the
      # existing pins instead of re-resolving to whatever is newest on PyPI at
      # run time — drift then means a real change in the .in/pyproject, not the
      # passage of time. Only the `pkg==ver` pin lines are compared; the header
      # and `# via` provenance comments are noise.
      - name: Check base.txt + dev.txt are in sync
        run: |
          set -e
          for layer in base dev; do
            cp "requirements/$layer.txt" "/tmp/$layer.txt"
            pip-compile --quiet --output-file="/tmp/$layer.txt" "requirements/$layer.in"
            diff <(grep -E '^[a-zA-Z0-9]' "requirements/$layer.txt" | sort) \
                 <(grep -E '^[a-zA-Z0-9]' "/tmp/$layer.txt" | sort) \
              || { echo "!! requirements/$layer.txt out of sync — run 'make compile'"; exit 1; }
          done
          echo "requirements in sync."

  pip-audit:
    name: pip-audit (CVE scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit==2.7.3
      - run: pip-audit -r requirements/base.txt
