repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files

  # Keep this rev in lockstep with the pinned ``ruff`` in requirements/dev.txt.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle (docstring style)
        files: ^hookrunner/.*\.py$

  - repo: https://github.com/terrencepreilly/darglint
    rev: v1.8.1
    hooks:
      - id: darglint
        name: darglint (docstring completeness)
        args: ["-v", "2"]
        files: ^hookrunner/.*\.py$

# NOTE: requirements/*.txt sync is NOT a local pre-commit hook. pip-compile
# embeds the running interpreter version in the file header and re-resolves on
# each run, so a local hook (system Python) churns the header vs the canonical
# 3.12-compiled lockfiles and blocks commits. The CI `deps-drift` job is the
# real gate (compares pin lines only, interpreter-agnostic). Run `make compile`
# after editing requirements/*.in or pyproject deps.
