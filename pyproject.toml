[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hookrunner"
version = "0.1.0"
description = "Local HMAC-signed webhook receiver + replay tool for backend dev"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prajwal Mahajan" }]
keywords = ["webhooks", "hmac", "cli", "stripe", "github", "signature-verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
# Runtime deps — single source of truth. requirements/base.in compiles from here.
dependencies = [
    "typer",
    "httpx",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pip-tools",
    "pre-commit",
    "ruff",
    "mypy",
    "pydocstyle",
    "darglint",
    "pytest",
    "pytest-cov",
]

[project.scripts]
hookrunner = "hookrunner.cli:app"

[project.urls]
Repository = "https://github.com/prajwalmahajan101/hookrunner"

[tool.hatch.build.targets.wheel]
packages = ["hookrunner"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pydocstyle]
convention = "google"
# Package/module-level __init__ docstrings not required; the package docstring
# lives in hookrunner/__init__.py.
add-ignore = "D104"

[tool.darglint]
docstring_style = "google"
strictness = "full"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
addopts = "--cov=hookrunner --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["hookrunner"]
branch = true
omit = ["hookrunner/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
